<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- we will rewrite this content in JS when the input gets / loses focus -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Knife Engraving Customiser</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Lobster&family=Roboto&display=swap" rel="stylesheet">

<style>
:root{--accent:#111;--bg:#fafafa;--border:#ddd;--pad:1rem;--radius:.5rem;}
*{box-sizing:border-box;}
body{margin:0;font-family:Roboto,Arial,Helvetica,sans-serif;background:var(--bg);color:#222;}
h1{text-align:center;margin:.5rem 0 1rem;}
.container{max-width:1200px;margin:auto;padding:var(--pad);display:flex;flex-direction:column;gap:var(--pad);}
.section{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:var(--pad);}
#product-picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.75rem;}
.product-option{position:relative;}
.product-option input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.product-option img{width:100%;border:2px solid transparent;border-radius:var(--radius);display:block;}
.product-option input:checked+img{border-color:var(--accent);}
.controls{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;}
.controls label{font-size:.9rem;margin-right:.25rem;}
#canvas-wrapper{width:100%;max-width:900px;max-height:600px;margin:auto;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:#eaeaea;text-align:center;}
canvas{touch-action:none;display:block;width:100%;height:auto;}
button{background:var(--accent);color:#fff;border:none;padding:.6rem 1rem;border-radius:var(--radius);cursor:pointer;font-weight:600;}
button[disabled]{opacity:.4;cursor:not-allowed;}
@media(max-width:600px){.controls{flex-direction:column;align-items:flex-start;}}
</style>
</head>
<body>
<h1>Knife Engraving Customiser</h1>
<div class="container">

  <!-- 1. PRODUCT -->
  <div class="section">
    <h2 style="margin-top:0;">1. Choose your knife</h2>
    <div id="product-picker">
      <label class="product-option"><input type="radio" name="product" value="chef.jpg"><img src="chef.jpg" alt="Chef knife"></label>
      <label class="product-option"><input type="radio" name="product" value="santoku.jpg"><img src="santoku.jpg" alt="Santoku knife"></label>
      <label class="product-option"><input type="radio" name="product" value="paring.jpg"><img src="paring.jpg" alt="Paring knife"></label>
      <label class="product-option"><input type="radio" name="product" value="utility.jpg"><img src="utility.jpg" alt="Utility knife"></label>
    </div>
  </div>

  <!-- 2. CONTROLS -->
  <div class="section">
    <h2 style="margin-top:0;">2. Customise text</h2>
    <div class="controls">
      <div><label for="engraveText">Text:</label><input type="text" id="engraveText" placeholder="Enter engraving"></div>
      <div><label for="fontSelect">Font:</label>
        <select id="fontSelect">
          <option value="Montserrat">Montserrat</option>
          <option value="Roboto">Roboto</option>
          <option value="Lobster">Lobster</option>
          <option value="'Times New Roman',serif">Times New Roman</option>
          <option value="Courier New">Courier New</option>
          <option value="Arial">Arial</option>
        </select>
      </div>
      <div><label for="fontSize">Size:</label><input type="number" id="fontSize" value="48" min="10" max="300" style="width:5rem;"></div>
    </div>
  </div>

  <!-- 3. PREVIEW -->
  <div class="section">
    <h2 style="margin-top:0;">3. Drag the text to position</h2>
    <div id="canvas-wrapper"><canvas id="viewCanvas"></canvas></div>
    <div style="text-align:center;margin-top:1rem;">
      <button id="generateBtn" disabled>Generate & Download PNG files</button>
    </div>
  </div>

</div>

<script>
/* ---------------------------------------------------------------
   ELEMENTS & GLOBAL STATE
----------------------------------------------------------------*/
const radios = document.querySelectorAll('[name="product"]');
const txt    = document.getElementById('engraveText');
const font   = document.getElementById('fontSelect');
const fSize  = document.getElementById('fontSize');
const view   = document.getElementById('viewCanvas');
const vCtx   = view.getContext('2d');
const full   = document.createElement('canvas');      // full-rez (knife + text)
const fCtx   = full.getContext('2d');
const genBtn = document.getElementById('generateBtn');
const viewportMeta = document.querySelector('meta[name="viewport"]');

let img=null, pos={x:0,y:0}, scale=1, dragging=false, offX=0, offY=0;

/* ---------------------------------------------------------------
   HELPERS
----------------------------------------------------------------*/
async function loadImageHighRes(src){
  const blob=await fetch(src,{mode:'cors'}).then(r=>r.blob());
  const url =URL.createObjectURL(blob);
  return new Promise(res=>{
    const i=new Image(); i.onload=_=>{URL.revokeObjectURL(url);res(i);} ; i.src=url;
  });
}
function updateScale(){
  const MAX_W=900, MAX_H=600;
  scale=Math.min(1,MAX_W/img.naturalWidth,MAX_H/img.naturalHeight);
  view.width = img.naturalWidth*scale;
  view.height= img.naturalHeight*scale;
  full.width = img.naturalWidth;
  full.height= img.naturalHeight;
}
function draw(){
  if(!img)return;
  /* full-rez preview */
  fCtx.clearRect(0,0,full.width,full.height);
  fCtx.drawImage(img,0,0);
  fCtx.font=`${fSize.value}px ${font.value}`; fCtx.fillStyle='#000'; fCtx.textBaseline='top';
  fCtx.fillText(txt.value,pos.x,pos.y);

  /* scaled view */
  vCtx.setTransform(scale,0,0,scale,0,0);
  vCtx.clearRect(0,0,view.width/scale,view.height/scale);
  vCtx.drawImage(img,0,0);
  vCtx.font=`${fSize.value}px ${font.value}`; vCtx.fillStyle='#000'; vCtx.textBaseline='top';
  vCtx.fillText(txt.value,pos.x,pos.y);
  vCtx.setTransform(1,0,0,1,0,0);
}
function withinText(mx,my){
  vCtx.font=`${fSize.value}px ${font.value}`;
  const w=vCtx.measureText(txt.value).width*scale;
  const h=parseInt(fSize.value,10)*scale;
  return mx>=pos.x*scale && mx<=pos.x*scale+w && my>=pos.y*scale && my<=pos.y*scale+h;
}
function downloadCanvas(can,filename){
  const trigger=url=>{
    const a=document.createElement('a');a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},100);
  };
  if(can.toBlob){can.toBlob(b=>trigger(URL.createObjectURL(b)));}else{trigger(can.toDataURL('image/png'));}
}

/* ---------------------------------------------------------------
   DRAG HANDLERS (pointer + touch fallback)
----------------------------------------------------------------*/
function startDrag(clientX,clientY,idSetter){
  const rect=view.getBoundingClientRect();
  const mx=clientX-rect.left, my=clientY-rect.top;
  if(withinText(mx,my)){dragging=true;offX=mx-pos.x*scale;offY=my-pos.y*scale;idSetter&&idSetter();}
}
function moveDrag(clientX,clientY){
  if(!dragging)return;
  const rect=view.getBoundingClientRect();
  pos.x=(clientX-rect.left-offX)/scale;
  pos.y=(clientY-rect.top-offY)/scale;
  draw();
}
function endDrag(){dragging=false;}

/* Pointer Events (modern) */
if('PointerEvent' in window){
  view.addEventListener('pointerdown',e=>startDrag(e.clientX,e.clientY,()=>view.setPointerCapture(e.pointerId)));
  view.addEventListener('pointermove',e=>moveDrag(e.clientX,e.clientY));
  ['pointerup','pointercancel'].forEach(ev=>view.addEventListener(ev,endDrag));
}
/* Touch fallback */
else{
  view.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    startDrag(e.touches[0].clientX,e.touches[0].clientY);
    e.preventDefault();                  // stop page scroll
  },{passive:false});
  view.addEventListener('touchmove',e=>{
    if(e.touches.length!==1)return;
    moveDrag(e.touches[0].clientX,e.touches[0].clientY);
    e.preventDefault();
  },{passive:false});
  view.addEventListener('touchend',endDrag);
}

/* ---------------------------------------------------------------
   OTHER EVENTS
----------------------------------------------------------------*/
radios.forEach(r=>r.addEventListener('change',async e=>{
  img=await loadImageHighRes(e.target.value);
  updateScale();
  pos.x=img.naturalWidth*0.5-100;
  pos.y=img.naturalHeight*0.5-20;
  draw(); genBtn.disabled=false;
}));

[txt,font,fSize].forEach(el=>el.addEventListener('input',draw));

/* restore viewport after typing */
txt.addEventListener('focus',()=>{
  viewportMeta.content='width=device-width,initial-scale=1,maximum-scale=10';   // allow zoom-in while keyboard open
});
txt.addEventListener('blur',()=>{
  viewportMeta.content='width=device-width,initial-scale=1,maximum-scale=1';    // snap back
  setTimeout(()=>window.scrollTo({top:0,left:0,behavior:'instant'}),50);        // ensure full-view
});

/* EXPORT BOTH PNGs */
genBtn.addEventListener('click',()=>{
  draw();
  downloadCanvas(full,'preview.png');               // knife + text
  const textCan=document.createElement('canvas');   // text only
  textCan.width=full.width;textCan.height=full.height;
  const tCtx=textCan.getContext('2d');
  tCtx.font=`${fSize.value}px ${font.value}`; tCtx.fillStyle='#000'; tCtx.textBaseline='top';
  tCtx.fillText(txt.value,pos.x,pos.y);
  downloadCanvas(textCan,'text-only.png');
});
</script>
</body>
</html>
