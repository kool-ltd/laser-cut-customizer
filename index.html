<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Knife Engraving Customiser</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Lobster&family=Roboto&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#111;
  --bg:#fafafa;
  --border:#ddd;
  --pad:1rem;
  --radius:.5rem;
}
*{box-sizing:border-box;}
body{margin:0;font-family:Roboto,Arial,Helvetica,sans-serif;background:var(--bg);color:#222;}
h1{text-align:center;margin:.5rem 0 1rem;}
.container{max-width:1200px;margin:auto;padding:var(--pad);display:flex;flex-direction:column;gap:var(--pad);}
.section{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:var(--pad);}
#product-picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.75rem;}
.product-option{position:relative;}
.product-option input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.product-option img{width:100%;border:2px solid transparent;border-radius:var(--radius);display:block;}
.product-option input:checked + img{border-color:var(--accent);}
.controls{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;}
.controls label{font-size:.9rem;margin-right:.25rem;}
#canvas-wrapper{width:100%;max-width:900px;max-height:600px;margin:auto;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:#eaeaea;text-align:center;}
canvas{touch-action:none;display:block;width:100%;height:auto;}
.buttons{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1rem;}
button,a.download{background:var(--accent);color:#fff;border:none;padding:.6rem 1rem;border-radius:var(--radius);cursor:pointer;text-decoration:none;font-weight:600;}
button[disabled]{opacity:.4;cursor:not-allowed;}
@media(max-width:600px){.controls{flex-direction:column;align-items:flex-start;}}
</style>
</head>
<body>
<h1>Knife Engraving Customiser</h1>
<div class="container">

  <!-- 1. PRODUCT CHOICE -->
  <div class="section">
    <h2 style="margin-top:0;">1. Choose your knife</h2>
    <div id="product-picker">
      <label class="product-option">
        <input type="radio" name="product" value="chef.jpg">
        <img src="chef.jpg" alt="Chef Knife">
      </label>
      <label class="product-option">
        <input type="radio" name="product" value="santoku.jpg">
        <img src="santoku.jpg" alt="Santoku Knife">
      </label>
      <label class="product-option">
        <input type="radio" name="product" value="paring.jpg">
        <img src="paring.jpg" alt="Paring Knife">
      </label>
      <label class="product-option">
        <input type="radio" name="product" value="utility.jpg">
        <img src="utility.jpg" alt="Utility Knife">
      </label>
    </div>
  </div>

  <!-- 2. ENGRAVING CONTROLS -->
  <div class="section">
    <h2 style="margin-top:0;">2. Customise text</h2>
    <div class="controls">
      <div>
        <label for="engraveText">Text:</label>
        <input type="text" id="engraveText" placeholder="Enter engraving">
      </div>
      <div>
        <label for="fontSelect">Font:</label>
        <select id="fontSelect">
          <option value="Montserrat">Montserrat</option>
          <option value="Roboto">Roboto</option>
          <option value="Lobster">Lobster</option>
          <option value="'Times New Roman',serif">Times New Roman</option>
          <option value="Courier New">Courier New</option>
          <option value="Arial">Arial</option>
        </select>
      </div>
      <div>
        <label for="fontSize">Size:</label>
        <input type="number" id="fontSize" value="48" min="10" max="300" style="width:5rem;">
      </div>
    </div>
  </div>

  <!-- 3. LIVE PREVIEW -->
  <div class="section">
    <h2 style="margin-top:0;">3. Position the text (drag &amp; drop)</h2>
    <div id="canvas-wrapper">
      <canvas id="viewCanvas"></canvas>
    </div>
    <div class="buttons">
      <button id="generateBtn" disabled>Generate download files</button>
      <a id="dlPreview" class="download" download="preview.png" style="display:none;">Download preview</a>
      <a id="dlText" class="download" download="text-only.png" style="display:none;">Download text-only</a>
    </div>
  </div>

</div><!-- /container -->

<script>
/* ============================================================================
   ELEMENTS & STATE
============================================================================ */
const radios   = document.querySelectorAll('[name="product"]');
const txt      = document.getElementById('engraveText');
const fontSel  = document.getElementById('fontSelect');
const sizeSel  = document.getElementById('fontSize');
const vCan     = document.getElementById('viewCanvas');           // visible
const vCtx     = vCan.getContext('2d');
const xCan     = document.createElement('canvas');                // export
const xCtx     = xCan.getContext('2d');
const genBtn   = document.getElementById('generateBtn');
const dlPrev   = document.getElementById('dlPreview');
const dlText   = document.getElementById('dlText');

let img=null;                 // loaded Image
let pos={x:0,y:0};            // text pos in FULL resolution
let scale=1;                  // view = full * scale
let dragging=false,offX=0,offY=0;

/* ============================================================================
   HELPERS
============================================================================ */
function loadImage(src){
  return new Promise((res,rej)=>{
    const i=new Image();
    i.crossOrigin="anonymous";      // avoid tainted canvas
    i.onload=()=>res(i);
    i.onerror=rej;
    i.src=src;
  });
}

function updateScale(){
  const maxW=900, maxH=600;
  scale=Math.min(1,maxW/img.naturalWidth,maxH/img.naturalHeight);
  vCan.width = img.naturalWidth*scale;
  vCan.height= img.naturalHeight*scale;
  xCan.width = img.naturalWidth;
  xCan.height= img.naturalHeight;
}

function draw(){
  if(!img)return;
  // --- full-rez canvas (export) ---
  xCtx.clearRect(0,0,xCan.width,xCan.height);
  xCtx.drawImage(img,0,0);
  xCtx.font=`${sizeSel.value}px ${fontSel.value}`;
  xCtx.fillStyle="#000";
  xCtx.textBaseline="top";
  xCtx.fillText(txt.value,pos.x,pos.y);

  // --- scaled view canvas ---
  vCtx.setTransform(scale,0,0,scale,0,0);  // simple scale matrix
  vCtx.clearRect(0,0,vCan.width/scale,vCan.height/scale);
  vCtx.drawImage(img,0,0);
  vCtx.font=`${sizeSel.value}px ${fontSel.value}`;
  vCtx.fillStyle="#000";
  vCtx.textBaseline="top";
  vCtx.fillText(txt.value,pos.x,pos.y);
  vCtx.setTransform(1,0,0,1,0,0); // reset
}

function hit(mx,my){
  vCtx.font=`${sizeSel.value}px ${fontSel.value}`;
  const w=vCtx.measureText(txt.value).width*scale;
  const h=parseInt(sizeSel.value,10)*scale;
  return mx>=pos.x*scale && mx<=pos.x*scale+w && my>=pos.y*scale && my<=pos.y*scale+h;
}

/* ============================================================================
   EVENTS
============================================================================ */
radios.forEach(r=>{
  r.addEventListener('change',async e=>{
    img=await loadImage(e.target.value);
    updateScale();
    pos.x=img.naturalWidth*0.5-100;
    pos.y=img.naturalHeight*0.5-20;
    draw();
    genBtn.disabled=false;
  });
});

[txt,fontSel,sizeSel].forEach(el=>el.addEventListener('input',draw));

vCan.addEventListener('pointerdown',e=>{
  const rect=vCan.getBoundingClientRect();
  const mx=e.clientX-rect.left;
  const my=e.clientY-rect.top;
  if(hit(mx,my)){
    dragging=true;
    offX=mx-pos.x*scale;
    offY=my-pos.y*scale;
    vCan.setPointerCapture(e.pointerId);
  }
});
vCan.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const rect=vCan.getBoundingClientRect();
  pos.x=(e.clientX-rect.left-offX)/scale;
  pos.y=(e.clientY-rect.top-offY)/scale;
  draw();
});
['pointerup','pointercancel'].forEach(ev=>vCan.addEventListener(ev,()=>dragging=false));

/* --- GENERATE FILES --- */
genBtn.addEventListener('click',()=>{
  draw(); // ensure latest

  dlPrev.href = vCan.toDataURL('image/png');     // scaled preview for customer
  dlPrev.style.display='inline-flex';

  dlText.href = xCan.toDataURL('image/png');     // full-rez text-only
  dlText.style.display='inline-flex';
});
</script>
</body>
</html>
